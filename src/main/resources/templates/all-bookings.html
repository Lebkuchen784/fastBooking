<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>fastBooking: All bookings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>
<header class="dashboard-header" style="position: relative;">
    <a th:href="@{/owners/{ownerId}(ownerId=${owner.ID})}" class="button" style="position: absolute; left: 0; top: 0;">Back</a>
    <form th:action="@{/owners/{ownerId}/all-bookings(ownerId=${owner.ID})}" method="get" style="position: absolute; right: 0; top: 0;">
        <label>
            <input class="login-form" type="text" name="searchQueryName" th:value="${searchQueryName}" placeholder="Search by name... (Enter)">
        </label>
    </form>
    <h1>Booking database</h1>
</header>

<div class="all-bookings-container">
    <main class="dashboard-card">
        <div class="table-responsive">
            <table id="dataTable" class="data-table">
                <thead>
                <tr>
                    <th>Client</th>
                    <th>Client email</th>
                    <th>Booking ID</th>
                    <th>Service</th>
                    <th>Date and Time</th>
                    <th>Payment</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${!bookingsPage.hasContent()}">
                    <td colspan="6" class="empty-state">There are no bookings available to show.</td>
                </tr>
                <tr th:each="booking : ${bookingsPage.content}">
                    <td th:unless="${booking.getHasBeenCancelled()}" th:text="${booking.getClientFirstName() + ' ' + booking.getClientLastName()}"></td>
                    <td th:if="${booking.hasBeenCancelled}" th:text="|❌ ${booking.getClientFirstName() + ' ' + booking.getClientLastName()} [CANCELLED]|"></td>
                    <td th:text="${booking.getAssociatedEmailAddress()}"></td>
                    <td class="mono-text" th:text="${booking.getID()}"></td>
                    <td th:text="${booking.getBookingServicesToBeProvided()}"></td>
                    <td>
                        <span th:text="${#temporals.format(booking.getBookingDateAndTime(), 'dd-MM-yyyy')}"></span>
                        <span th:text="|${#temporals.format(booking.getBookingDateAndTime(), 'HH:mm')} - ${#temporals.format(booking.getBookingDateAndTime().plusMinutes(booking.getBookingDurationInMinutes()), 'HH:mm')}|"></span>
                    </td>
                    <td>
                        <span th:if="${booking.getBookingIsPaid() == null}" class="status-text-blue-cash"
                        th:text="'CASH'"></span>
                        <span th:if="${booking.getBookingIsPaid != null && booking.getBookingIsPaid()}" class="status-text-green-isPaid"
                              th:text="'COMPLETED'"></span>
                        <span th:if="${booking.getBookingIsPaid != null && !booking.getBookingIsPaid()}" class="status-text-red-isNotPaid"
                              th:text="'PENDING'"></span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <nav class="pagination"
             th:if="${bookingsPage.totalPages > 0}">
            <a class="button"
               th:if="${bookingsPage.hasPrevious()}"
               th:href="@{/owners/{ownerId}/all-bookings(ownerId=${owner.ID}, page=${bookingsPage.number - 1}, searchQueryName=${searchQueryName})}">
            Previous
            </a>
            <span class="button pagination-disabled"
                  th:if="${!bookingsPage.hasPrevious()}">
                Previous
            </span>

            <span class="page-indicator"
                  th:text="|Page ${bookingsPage.number + 1} of ${bookingsPage.totalPages}|">
                Page 0 of 0
            </span>

            <a class="button"
               th:if="${bookingsPage.hasNext()}"
               th:href="@{/owners/{ownerId}/all-bookings(ownerId=${owner.ID}, page=${bookingsPage.number + 1}, searchQueryName=${searchQueryName})}">
                Next
            </a>
            <span class="button pagination-disabled"
                  th:if="${!bookingsPage.hasNext()}">
                Next
            </span>
        </nav>
    </main>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const cells = document.querySelectorAll('.data-table td');

        cells.forEach(cell => {
            if (cell.classList.contains('empty-state')) return;

            cell.addEventListener('click', () => {
                cell.classList.toggle('expanded');
            });
        });
    });
</script>
</body>
</html>
