<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>fastBooking: Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>
<header class="signup-header" style="position: relative;">
    <a th:href="@{/}" class="btn-secondary" style="position: absolute; left: 0; top: 50%; transform: translateY(-50%);">&larr; Back</a>
    <h1>Register an account</h1>
</header>
<div class="login-container">
    <main class="dashboard-card">
        <h2 class="dashboard-header">Enter your information</h2>
        <div class="login-form-container">
            <label class="login-fields">
                <input class="login-form" type="text" name="firstName" placeholder="First name">
            </label>
            <label class="login-fields">
                <input class="login-form" type="text" name="lastName" placeholder="Last name">
            </label>
            <label class="login-fields">
                <input class="login-form" type="email" name="email" placeholder="Email address">
            </label>
            <label class="login-fields">
                <input class="login-form" type="password" name="password" placeholder="Password">
            </label>
            <input type="submit" class="btn-secondary" value="Sign up">
        </div>
    </main>
</div>
</body>
</html>
