<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>fastBooking: Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>
<header class="signup-header" style="position: relative;">
    <a th:href="@{/}" class="btn-secondary" style="position: absolute; left: 0; top: 50%; transform: translateY(-50%);">&larr;
        Back</a>
    <h1>Register an account</h1>
</header>
<div class="login-container">
    <main class="dashboard-card">
        <h2 class="dashboard-header">Enter your information</h2>
        <form th:action="@{/owners/register}" method="post" class="login-form-container">

            <label class="login-fields">
                <input class="login-form" type="text" name="firstName" placeholder="First name" required>
            </label>
            <label class="login-fields">
                <input class="login-form" type="text" name="lastName" placeholder="Last name" required>
            </label>
            <label class="login-fields">
                <input class="login-form" type="email" name="emailAddress" placeholder="Email address" required>
            </label>
            <label class="login-fields">
                <input class="login-form" type="password" name="password" placeholder="Password" required>
            </label>
            <label class="login-fields">
                <input class="login-form" type="text" name="typeOfBusiness" placeholder="Type of business" required>
            </label>
            <label class="login-fields">
                <input class="login-form" type="text" name="ownerBusinessAddress" placeholder="Business address"
                       required>
            </label>

            <!-- Still to do; how to deal with active vs inactive accounts that are actively paying or not -->
            <input type="hidden" name="accountStatus" value="true">

            <label class="login-fields">
                <select class="login-form" name="paymentMethod" required>
                    <option value="" disabled selected hidden>Select payment method</option>
                    <option value="PAYPAL">Paypal</option>
                    <option value="DEBIT_CARD">Debit card</option>
                    <option value="CREDIT_CARD">Credit card</option>
                    <option value="BITCOIN">Bitcoin</option>
                    <option value="SEPA_BANK_TRANSFER">SEPA Bank Transfer</option>
                </select>
            </label>

            <button type="submit" class="btn-secondary">Sign up</button>
        </form>
    </main>
</div>
</body>
</html>
